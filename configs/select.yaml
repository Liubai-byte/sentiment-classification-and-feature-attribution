# --- Model rebuild (must match configs/default.yaml used during training) ---
model: cnn
embedding_dim: 300
hidden_dim: 150
data_dir: data/SST2
checkpoint: "outputs/checkpoints/cnn_best_model_20261018-132653.pth"   # <- After training, fill in the printed outputs/checkpoints/best_model_<timestamp>.pth here

# --- Selection rules ---
n_correct: 3       # How many correctly predicted examples to select
n_mistakes: 3      # How many incorrectly predicted examples to select
seed: 1            # Random seed for reproducibility

# --- Output directory name (leave empty to auto-use <model>_<timestamp>) ---
run_name: ""
