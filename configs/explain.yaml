# --- Model rebuild (must match configs/default.yaml used during training) ---
model: cnn
embedding_dim: 300
hidden_dim: 150
data_dir: data/SST2
checkpoint: "outputs/checkpoints/cnn_best_model_20261018-132653.pth"   # <- After training, fill in the printed outputs/checkpoints/best_model_<timestamp>.pth here

# --- Sentences to explain (choose one of the two ways, or use both) ---
# Way 1: list them directly here
# sentences:
#   - "makes an aborbing if arguable case for the man 's greatness"
#   - "still , it gets the job done a sleepy afternoon rental"
# Way 2: use a file (e.g. the sentence list produced by select_examples.py)
sentences_file: outputs/select/cnn_20261018-135431/selected_sentences.txt

# --- IG parameters ---
n_steps: 50
target: null            # 0=negative, 1=positive; null=explain the model's own prediction

# --- Output directory name (leave empty to auto-use <model>_<timestamp>; each run does not overwrite previous runs) ---
run_name: ""

# --- Ablation: replace/delete a high-contribution word for a before/after comparison ---
ablation:
  enabled: false
  sentence: ""          # Which sentence to run on (leave empty to use sentences[0])
  word: "arguable"      # The high-contribution word to operate on
  replacement: "the"    # Replace with this word; set to null to delete
