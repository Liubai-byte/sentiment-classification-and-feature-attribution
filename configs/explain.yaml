# —— 模型重建（需与训练时 configs/default.yaml 一致）——
model: cnn
embedding_dim: 300
hidden_dim: 150
data_dir: data/SST2
checkpoint: "outputs/checkpoints/cnn_best_model_20261018-132653.pth"   # ← 训练结束后，把打印出来的 outputs/checkpoints/best_model_<时间戳>.pth 填到这里

# —— 要解释的句子（两种方式二选一，也可同时用）——
# 方式1：直接在这里列
# sentences:
#   - "makes an aborbing if arguable case for the man 's greatness"
#   - "still , it gets the job done a sleepy afternoon rental"
# 方式2：用文件（例如 select_examples.py 产出的句子清单）
sentences_file: outputs/select/cnn_20261018-135431/selected_sentences.txt

# —— IG 参数 ——
n_steps: 50
target: null            # 0=negative, 1=positive；null=解释模型自己的预测

# —— 输出目录名（留空则自动用 <model>_<时间戳>，每次实验互不覆盖）——
run_name: ""

# —— 消融：替换/删除一个高贡献词，做 before/after 对比 ——
ablation:
  enabled: false
  sentence: ""          # 在哪个句子上做（留空则用 sentences[0]）
  word: "arguable"      # 要操作的高贡献词
  replacement: "the"    # 替换成这个词；设为 null 表示删除
