model: cnn        # lstm / bilstm / cnn
embedding_dim: 300       # Embedding dimension (change to 100 when using GloVe 100d)
hidden_dim: 150          # LSTM hidden dimension
batch_size: 32
epochs: 20
learning_rate: 0.001   # Note: 1e-3 is parsed as a string by PyYAML, so use a decimal
seed: 1
data_dir: data/SST2
# embedding_path: data/glove.6B.100d.txt   # Optional: pretrained word vectors; random init if omitted
