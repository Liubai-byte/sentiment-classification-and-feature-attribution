[project]
name = "pytorch-sentiment-classification"
version = "0.1.0"
description = "SST-2 sentiment classification with Integrated Gradients feature attribution (AIE1903 Homework 1)"
authors = [
    { name = "han", email = "hanhhh0101@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "captum>=0.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
